<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토익 모의 타이머</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #dfe2e7;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --face: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #191c22;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --border: #2b2f37;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --face: #e9e9e6;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  button, input { font: inherit; color: inherit; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }

  /* 선택 버튼 묶음 */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: block;
    height: 100%;
    text-align: center;
    padding: 10px 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-weight: 600;
  }
  .seg small { display: block; font-weight: 400; font-size: .8rem; opacity: .8; }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* RC 구간 설정 */
  .plan-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .plan-name { font-weight: 600; }
  .plan-inputs { display: flex; align-items: center; gap: 4px; }
  .plan-inputs input {
    width: 3.6em;
    padding: 6px;
    text-align: right;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .plan-at { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
  .plan-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .error { color: var(--danger); font-weight: 600; }

  .toggle { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 6px 10px; font-size: .85rem; }
  .start-bar { display: grid; gap: 8px; }
  .start-bar .btn { padding: 14px; font-size: 1.1rem; }
  .summary { text-align: center; color: var(--muted); }

  /* 시험 화면 */
  .exam-grid { display: grid; gap: 12px; }
  @media (min-width: 860px) {
    .exam-grid { grid-template-columns: 1.1fr 1fr; align-items: start; }
  }
  .clock-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  #clock { width: min(100%, 340px, 42vh); height: auto; }
  #clock .rim { fill: #2b2f37; }
  #clock .face { fill: var(--face); }
  #clock .ticks line { stroke: #111; }
  #clock .ticks text { font-size: 15px; font-weight: 600; fill: #111; text-anchor: middle; dominant-baseline: central; }
  #clock .hand { stroke: #111; stroke-linecap: round; }
  #clock .hour { stroke-width: 6; }
  #clock .min { stroke-width: 4; }
  #clock .sec { stroke: #dc2626; stroke-width: 1.5; }
  #clock .pin { fill: #dc2626; }

  .board {
    background: #0b0c0f;
    color: #ffb020;
    border-radius: 14px;
    padding: 16px;
    font-family: ui-monospace, "SFMono-Regular", Consolas, "Malgun Gothic", monospace;
    font-variant-numeric: tabular-nums;
  }
  .board-part { color: #f3f4f6; font-weight: 700; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .board-time { font-size: clamp(2.6rem, 13vw, 4.6rem); font-weight: 700; line-height: 1.1; letter-spacing: .02em; margin: 4px 0; }
  .board-sub { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: #c9cdd3; font-size: .9rem; }
  .board-sub b { color: #ffb020; font-weight: 600; }
  .board-goal { color: #c9cdd3; font-size: .9rem; margin-top: 4px; min-height: 1.4em; }
  .progress { position: relative; height: 10px; background: #262a31; border-radius: 5px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: #ffb020; }
  .progress-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #0b0c0f; }

  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  .checks li:last-child { border-bottom: 0; }
  .checks .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); }
  .checks .ck-name { font-weight: 600; }
  .checks .ck-name small { font-weight: 400; margin-left: 4px; }
  .checks .ck-status { font-size: .85rem; text-align: right; }
  .checks li.current { color: var(--text); }
  .checks li.current .dot { border-color: var(--accent); background: var(--accent); }
  .checks li.done { color: var(--ok); }
  .checks li.done .dot { border-color: var(--ok); background: var(--ok); }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls .wide { grid-column: 1 / -1; padding: 14px; font-size: 1.05rem; }

  /* 알림 */
  #banner {
    position: fixed;
    left: 16px;
    right: 16px;
    top: calc(12px + env(safe-area-inset-top));
    max-width: 600px;
    margin: 0 auto;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--warn);
    color: #111;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
    cursor: pointer;
    z-index: 10;
  }
  #flash {
    position: fixed;
    inset: 0;
    border: 10px solid var(--warn);
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  #flash.on { animation: flash .6s ease-in-out 4; }
  @keyframes flash { 50% { opacity: 1; } }
</style>
</head>
<body>
<main>
  <!-- 시작 설정 화면 -->
  <section id="setup">
    <h1>⏱️ 토익 모의 타이머</h1>

    <div class="card">
      <h2>시험 시간대</h2>
      <div class="seg">
        <label><input type="radio" name="session" value="am"><span>오전<small>10:10 시작</small></span></label>
        <label><input type="radio" name="session" value="pm"><span>오후<small>15:10 시작</small></span></label>
      </div>
    </div>

    <div class="card">
      <h2>풀이 영역</h2>
      <div class="seg">
        <label><input type="radio" name="mode" value="full"><span>전체<small>120분</small></span></label>
        <label><input type="radio" name="mode" value="lc"><span>LC만<small>45분</small></span></label>
        <label><input type="radio" name="mode" value="rc"><span>RC만<small>75분</small></span></label>
      </div>
    </div>

    <div class="card" id="planCard">
      <h2>RC 구간 설정</h2>
      <div id="planRows"></div>
      <div class="plan-foot">
        <span id="planBuffer"></span>
        <button type="button" class="btn small" id="btnPreset">12-10-25-25로 되돌리기</button>
      </div>
    </div>

    <div class="card">
      <h2>알림</h2>
      <label class="toggle"><input type="checkbox" id="optSound"> 비프음</label>
      <label class="toggle"><input type="checkbox" id="optFlash"> 화면 테두리 깜빡임</label>
      <button type="button" class="btn small" id="btnTestSound">소리 테스트</button>
    </div>

    <div class="start-bar">
      <p class="summary" id="summary"></p>
      <button type="button" class="btn primary" id="btnStart">시험 시작</button>
    </div>
  </section>

  <!-- 시험 진행 화면 -->
  <section id="exam" hidden>
    <div class="exam-grid">
      <div>
        <div class="clock-wrap">
          <svg id="clock" viewBox="0 0 200 200" role="img" aria-label="시험장 시계">
            <circle cx="100" cy="100" r="98" class="rim"/>
            <circle cx="100" cy="100" r="91" class="face"/>
            <g id="ticks" class="ticks"></g>
            <line id="hHour" x1="100" y1="112" x2="100" y2="56" class="hand hour"/>
            <line id="hMin" x1="100" y1="116" x2="100" y2="28" class="hand min"/>
            <line id="hSec" x1="100" y1="122" x2="100" y2="20" class="hand sec"/>
            <circle cx="100" cy="100" r="4" class="pin"/>
          </svg>
        </div>
        <div class="board">
          <div class="board-part" id="bPart"></div>
          <div class="board-time" id="bRemain" aria-label="남은 시간"></div>
          <div class="board-sub">
            <span>시험장 시각 <b id="bClock"></b></span>
            <span>경과 <b id="bElapsed"></b></span>
          </div>
          <div class="board-goal" id="bGoal"></div>
          <div class="progress" id="progress"><div class="progress-fill" id="pFill"></div></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>체크포인트</h2>
          <ol class="checks" id="checks"></ol>
        </div>
        <div class="controls">
          <button type="button" class="btn primary wide" id="btnNext">다음 파트로 ▶</button>
          <button type="button" class="btn" id="btnPause">일시정지</button>
          <button type="button" class="btn" id="btnSound"></button>
          <button type="button" class="btn" id="btnFull">전체 화면</button>
          <button type="button" class="btn danger" id="btnReset">그만하기</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="banner" role="status" hidden></div>
<div id="flash"></div>

<script>
  const LC_TOTAL = 45 * 60;
  const RC_TOTAL = 75 * 60;
  const RC_PARTS = [
    { short: 'Part 5', label: 'Part 5 단문 빈칸', endMsg: 'Part 5 종료 → Part 6 진입 권장' },
    { short: 'Part 6', label: 'Part 6 장문 빈칸', endMsg: 'Part 6 종료 → Part 7 단일지문 진입 권장' },
    { short: 'Part 7 단일', label: 'Part 7 단일지문', endMsg: 'Part 7 단일 종료 → 복합지문 진입 권장' },
    { short: 'Part 7 복합', label: 'Part 7 복합지문', endMsg: '풀이 종료 — 미마킹·세모 문제 최종 마킹 점검' },
  ];
  const DEFAULT_PLAN = [12 * 60, 10 * 60, 25 * 60, 25 * 60];
  const STORE_KEY = 'toeic-timer-settings';

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function hms(sec) {
    sec = Math.max(0, Math.floor(sec));
    return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec % 3600 / 60))}:${pad(sec % 60)}`;
  }
  function ms(sec) {
    sec = Math.max(0, Math.round(sec));
    return `${Math.floor(sec / 60)}:${pad(sec % 60)}`;
  }
  function clockHM(daySec) {
    daySec = Math.floor(daySec) % 86400;
    return `${pad(Math.floor(daySec / 3600))}:${pad(Math.floor(daySec % 3600 / 60))}`;
  }

  // ---------- 설정 ----------
  let settings = loadSettings();

  function loadSettings() {
    const def = { session: 'am', mode: 'full', plan: DEFAULT_PLAN.slice(), sound: true, flash: true };
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved && Array.isArray(saved.plan) && saved.plan.length === RC_PARTS.length) return { ...def, ...saved };
    } catch (e) {}
    return def;
  }
  function saveSettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function planIsValid() {
    const sum = settings.plan.reduce((a, b) => a + b, 0);
    return settings.plan.every(s => s > 0) && sum <= RC_TOTAL;
  }

  // 시험 시작 시각 (하루 기준 초). RC만 풀 때는 실제 RC 시작 시각부터.
  function baseClock(session, mode) {
    const hour = session === 'am' ? 10 : 15;
    return hour * 3600 + (mode === 'rc' ? 55 : 10) * 60;
  }

  function buildSegments(mode, plan) {
    const segs = [];
    let t = 0;
    if (mode !== 'rc') {
      segs.push({ short: 'LC', label: 'LC 듣기 (Part 1~4)', start: 0, end: LC_TOTAL, rc: false,
        endMsg: mode === 'full' ? 'LC 종료 → RC 시작 (Part 5)' : 'LC 종료' });
      t = LC_TOTAL;
    }
    if (mode !== 'lc') {
      const rcStart = t;
      plan.forEach((sec, i) => {
        segs.push({ ...RC_PARTS[i], start: t, end: t + sec, rc: true });
        t += sec;
      });
      if (t < rcStart + RC_TOTAL) {
        segs.push({ short: '마킹', label: '최종 검토 · 마킹', start: t, end: rcStart + RC_TOTAL, rc: true, endMsg: '' });
      }
      t = rcStart + RC_TOTAL;
    }
    return { segs, total: t };
  }

  // ---------- 설정 화면 ----------
  function renderSetup() {
    document.querySelector(`input[name=session][value=${settings.session}]`).checked = true;
    document.querySelector(`input[name=mode][value=${settings.mode}]`).checked = true;
    $('optSound').checked = settings.sound;
    $('optFlash').checked = settings.flash;
    renderPlan();
    updateSetupInfo();
  }

  function renderPlan() {
    $('planRows').innerHTML = RC_PARTS.map((p, i) => `
      <div class="plan-row">
        <span class="plan-name">${p.label}</span>
        <span class="plan-inputs">
          <input type="number" inputmode="numeric" min="0" max="75" data-i="${i}" data-k="m"
                 value="${Math.floor(settings.plan[i] / 60)}" aria-label="${p.label} 분">분
          <input type="number" inputmode="numeric" min="0" max="59" data-i="${i}" data-k="s"
                 value="${settings.plan[i] % 60}" aria-label="${p.label} 초">초
        </span>
        <span class="plan-at" id="planAt${i}"></span>
      </div>`).join('');
  }

  function updateSetupInfo() {
    let cum = 0;
    settings.plan.forEach((sec, i) => {
      cum += sec;
      $(`planAt${i}`).textContent = `RC 잔여 ${ms(RC_TOTAL - cum)}에 알림`;
    });
    const buffer = RC_TOTAL - cum;
    const valid = planIsValid();
    $('planBuffer').innerHTML = valid
      ? `최종 검토·마킹 <b>${ms(buffer)}</b>`
      : `<span class="error">${cum > RC_TOTAL ? `합계가 75분을 ${ms(-buffer)} 넘었어요` : '0분인 파트가 있어요'}</span>`;

    $('planCard').hidden = settings.mode === 'lc';
    const { total } = buildSegments(settings.mode, settings.plan);
    const base = baseClock(settings.session, settings.mode);
    $('summary').textContent = `시험장 시계 ${clockHM(base)} → ${clockHM(base + total)} · ${total / 60}분`;
    $('btnStart').disabled = settings.mode !== 'lc' && !valid;
  }

  document.querySelectorAll('input[name=session], input[name=mode]').forEach(el => {
    el.addEventListener('change', () => {
      settings[el.name] = el.value;
      saveSettings();
      updateSetupInfo();
    });
  });

  $('planRows').addEventListener('input', e => {
    const i = Number(e.target.dataset.i);
    if (Number.isNaN(i)) return;
    const row = e.target.closest('.plan-row');
    const m = Math.max(0, parseInt(row.querySelector('[data-k=m]').value, 10) || 0);
    const s = Math.min(59, Math.max(0, parseInt(row.querySelector('[data-k=s]').value, 10) || 0));
    settings.plan[i] = m * 60 + s;
    if (planIsValid()) saveSettings();
    updateSetupInfo();
  });

  $('btnPreset').addEventListener('click', () => {
    settings.plan = DEFAULT_PLAN.slice();
    saveSettings();
    renderPlan();
    updateSetupInfo();
  });

  $('optSound').addEventListener('change', e => { settings.sound = e.target.checked; saveSettings(); });
  $('optFlash').addEventListener('change', e => { settings.flash = e.target.checked; saveSettings(); });
  $('btnTestSound').addEventListener('click', () => { ensureAudio(); beep(2, true); });

  // ---------- 소리 · 알림 ----------
  let audioCtx = null;

  function ensureAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function beep(times, force) {
    if (!audioCtx || (!settings.sound && !force)) return;
    const t0 = audioCtx.currentTime + 0.05;
    for (let i = 0; i < times; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const s = t0 + i * 0.35;
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, s);
      gain.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(s);
      osc.stop(s + 0.3);
    }
  }

  let bannerTimer = null;
  function notify(msg, loud) {
    const b = $('banner');
    b.textContent = msg;
    b.hidden = false;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { b.hidden = true; }, 10000);
    if (!loud) return;
    beep(3);
    if (settings.flash) {
      const f = $('flash');
      f.classList.remove('on');
      void f.offsetWidth;
      f.classList.add('on');
    }
  }
  $('banner').addEventListener('click', () => { $('banner').hidden = true; });

  // ---------- 화면 꺼짐 방지 ----------
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) wakeLock.release().catch(() => {});
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && exam && !exam.done && !exam.pausedAt) requestWakeLock();
  });

  // ---------- 시험 진행 ----------
  let exam = null;

  function startExam() {
    ensureAudio();
    const { segs, total } = buildSegments(settings.mode, settings.plan);
    exam = {
      segs, total,
      base: baseClock(settings.session, settings.mode),
      startedAt: Date.now(),
      pausedAt: null,
      pausedTotal: 0,
      idx: 0,
      records: [],          // records[i] = { at: 끝난 시점(경과 초), manual: 버튼으로 넘겼는지 }
      alerted: new Set(),
      done: false,
      checksKey: '',
    };
    $('progress').querySelectorAll('.progress-tick').forEach(el => el.remove());
    segs.slice(0, -1).forEach(s => {
      const tick = document.createElement('div');
      tick.className = 'progress-tick';
      tick.style.left = `${s.end / total * 100}%`;
      $('progress').appendChild(tick);
    });
    $('setup').hidden = true;
    $('exam').hidden = false;
    window.scrollTo(0, 0);
    requestWakeLock();
    tick();
  }

  function elapsedSec() {
    const now = exam.pausedAt ?? Date.now();
    return Math.min(exam.total, (now - exam.startedAt - exam.pausedTotal) / 1000);
  }

  function tick() {
    if (!exam || exam.done) return;
    const el = elapsedSec();
    const last = exam.segs.length - 1;

    // 목표 시각이 지난 파트는 자동으로 다음 파트로
    while (exam.idx < last && el >= exam.segs[exam.idx].end) {
      exam.records[exam.idx] = { at: exam.segs[exam.idx].end, manual: false };
      exam.idx++;
    }

    exam.segs.forEach((s, i) => {
      if (i === last || el < s.end || exam.alerted.has(i)) return;
      exam.alerted.add(i);
      const ahead = exam.records[i] && exam.records[i].manual;
      notify(ahead ? `✓ ${s.short} 체크포인트 통과 (앞서 진행 중)` : s.endMsg, !ahead);
    });

    if (el >= exam.total) {
      exam.done = true;
      exam.records[last] = exam.records[last] || { at: exam.total, manual: false };
      notify('시험 종료 — 답안 작성을 멈추세요', true);
      releaseWakeLock();
    }
    render(el);
  }

  function render(el) {
    const t = exam.base + el;
    const sec = Math.floor(t);
    $('hSec').setAttribute('transform', `rotate(${(sec % 60) * 6} 100 100)`);
    $('hMin').setAttribute('transform', `rotate(${(t / 60 % 60) * 6} 100 100)`);
    $('hHour').setAttribute('transform', `rotate(${(t / 3600 % 12) * 30} 100 100)`);

    const seg = exam.segs[exam.idx];
    $('bClock').textContent = hms(sec % 86400);
    $('bElapsed').textContent = hms(el);
    $('bRemain').textContent = hms(Math.ceil(exam.total - el));
    $('pFill').style.width = `${el / exam.total * 100}%`;

    if (exam.done) {
      $('bPart').textContent = '시험 종료';
      $('bGoal').textContent = '';
    } else {
      $('bPart').textContent = `${seg.label} ${seg.rc ? '풀이 중' : '진행 중'}${exam.pausedAt ? ' · 일시정지' : ''}`;
      $('bGoal').textContent = `이 파트 목표 ${clockHM(exam.base + seg.end)}까지 ${ms(Math.ceil(seg.end - el))}`;
    }

    const key = `${exam.idx}|${exam.done}`;
    if (key !== exam.checksKey) {
      exam.checksKey = key;
      renderChecks();
    }

    $('btnNext').disabled = exam.done || !!exam.pausedAt || exam.idx >= exam.segs.length - 1;
    $('btnPause').textContent = exam.pausedAt ? '계속하기' : '일시정지';
    $('btnPause').disabled = exam.done;
    $('btnSound').textContent = settings.sound ? '🔔 소리 켬' : '🔕 무음';
    $('btnReset').textContent = exam.done ? '처음으로' : '그만하기';
  }

  function renderChecks() {
    $('checks').innerHTML = exam.segs.map((s, i) => {
      const target = clockHM(exam.base + s.end);
      const rec = exam.records[i];
      let cls = 'pending';
      let status = `목표 ${target}`;
      if (rec) {
        cls = 'done';
        status = rec.manual
          ? `${clockHM(exam.base + rec.at)} 완료 · ${ms(s.end - rec.at)} 빨리`
          : `${target} 통과`;
      } else if (i === exam.idx) {
        cls = 'current';
        status = `진행 중 · 목표 ${target}`;
      }
      return `<li class="${cls}"><span class="dot"></span>` +
        `<span class="ck-name">${s.short}<small>${ms(s.end - s.start)}</small></span>` +
        `<span class="ck-status">${status}</span></li>`;
    }).join('');
  }

  $('btnStart').addEventListener('click', startExam);

  $('btnNext').addEventListener('click', () => {
    if (!exam || exam.done || exam.pausedAt || exam.idx >= exam.segs.length - 1) return;
    exam.records[exam.idx] = { at: elapsedSec(), manual: true };
    exam.idx++;
    render(elapsedSec());
  });

  $('btnPause').addEventListener('click', () => {
    if (!exam || exam.done) return;
    if (exam.pausedAt) {
      exam.pausedTotal += Date.now() - exam.pausedAt;
      exam.pausedAt = null;
      requestWakeLock();
    } else {
      exam.pausedAt = Date.now();
      releaseWakeLock();
    }
    render(elapsedSec());
  });

  $('btnSound').addEventListener('click', () => {
    settings.sound = !settings.sound;
    saveSettings();
    $('optSound').checked = settings.sound;
    if (exam) render(elapsedSec());
  });

  const canFullscreen = !!document.documentElement.requestFullscreen;
  $('btnFull').hidden = !canFullscreen;
  $('btnFull').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  $('btnReset').addEventListener('click', () => {
    if (exam && !exam.done && !confirm('진행 중인 시험을 그만할까요?')) return;
    exam = null;
    releaseWakeLock();
    $('exam').hidden = true;
    $('setup').hidden = false;
    $('banner').hidden = true;
  });

  window.addEventListener('beforeunload', e => {
    if (exam && !exam.done) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- 시계판 그리기 ----------
  (function buildClockFace() {
    let html = '';
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      html += `<line x1="100" y1="${major ? 11 : 13}" x2="100" y2="${major ? 23 : 18}" ` +
        `stroke-width="${major ? 3 : 1}" transform="rotate(${i * 6} 100 100)"/>`;
    }
    for (let h = 1; h <= 12; h++) {
      const a = h * 30 * Math.PI / 180;
      html += `<text x="${(100 + 64 * Math.sin(a)).toFixed(1)}" y="${(100 - 64 * Math.cos(a)).toFixed(1)}">${h}</text>`;
    }
    $('ticks').innerHTML = html;
  })();

  renderSetup();
  setInterval(tick, 250);
</script>
</body>
</html>
